[project]
name = "preventivemeasure"
version = "1.0.0"
description = "Monitor de vulnerabilidades: inventaría tu stack y te avisa de CVE y noticias que te afectan"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[project.scripts]
preventivemeasure = "preventivemeasure.__main__:main"

[tool.setuptools.packages.find]
include = ["preventivemeasure*"]

[tool.setuptools.package-data]
preventivemeasure = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
