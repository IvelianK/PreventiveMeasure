name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # un release a medias es peor que esperar

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # crear el release
      id-token: write      # firmar la atestación de procedencia
      attestations: write  # guardar la atestación en el repositorio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA verificado
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, SHA verificado
        with:
          python-version: '3.x'
      - name: La etiqueta coincide con la versión del paquete
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de pyproject.toml"
            exit 1
          fi
      - name: Construir sdist y wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Probar el wheel recién construido
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel/bin/preventivemeasure --help
          /tmp/wheel/bin/python -c "import importlib.resources as r; assert (r.files('preventivemeasure') / 'static' / 'index.html').is_file()"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, SHA verificado
        with:
          subject-path: dist/*
      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notas: la sección de esta versión en CHANGELOG.md
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "PreventiveMeasure $GITHUB_REF_NAME" --notes-file notes.md
