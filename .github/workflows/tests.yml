name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA verificado
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, SHA verificado
        with:
          python-version: '3.11'
      - name: Instalar y probar
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests
